<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060606" />
    <meta name="description" content="NetPulse AI — live Wi-Fi monitoring, AI anomaly detection and automated troubleshooting." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23ccff00'/%3E%3Cpath d='M10 34h10l6-16 8 30 7-20 4 6h9' fill='none' stroke='%230a0a00' stroke-width='5' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>NetPulse AI · Network Intelligence</title>
    <style>
      /* Boot fallback: visible before the React bundle runs, so a slow or
         blocked script can never leave the page as a silent black screen. */
      #netpulse-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        background: #060606;
        color: #f4f4ef;
        font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
        text-align: center;
      }
      #netpulse-boot .boot-logo {
        font-family: "Anton", Impact, sans-serif;
        font-size: 30px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      #netpulse-boot .boot-logo span {
        color: #ccff00;
      }
      #netpulse-boot .boot-bar {
        width: 132px;
        height: 2px;
        overflow: hidden;
        background: rgba(204, 255, 0, 0.16);
      }
      #netpulse-boot .boot-bar::after {
        content: "";
        display: block;
        width: 44px;
        height: 100%;
        background: #ccff00;
        animation: boot-slide 1.1s ease-in-out infinite alternate;
      }
      #netpulse-boot .boot-msg {
        max-width: 340px;
        margin: 0;
        color: #a3a39a;
        font-size: 11px;
        line-height: 1.6;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      #netpulse-boot .boot-reload {
        border: 1px solid #ccff00;
        background: #ccff00;
        color: #0a0a00;
        padding: 10px 18px;
        font: inherit;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        cursor: pointer;
      }
      #netpulse-boot .boot-reload[hidden] {
        display: none;
      }
      @keyframes boot-slide {
        from { transform: translateX(-44px); }
        to { transform: translateX(132px); }
      }
      @media (prefers-reduced-motion: reduce) {
        #netpulse-boot .boot-bar::after { animation: none; width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="netpulse-boot" role="status" aria-live="polite">
        <div class="boot-logo">NetPulse <span>AI</span></div>
        <div class="boot-bar" aria-hidden="true"></div>
        <p class="boot-msg" id="boot-msg">Loading network intelligence…</p>
        <button class="boot-reload" id="boot-reload" type="button" onclick="window.location.reload()" hidden>
          Reload application
        </button>
        <noscript>
          <p class="boot-msg">JavaScript is disabled. Enable JavaScript, or open this site in Chrome, Edge, Firefox or Safari.</p>
        </noscript>
      </div>
    </div>
    <script>
      (function () {
        var message = document.getElementById('boot-msg')
        var reload = document.getElementById('boot-reload')

        function showFailure(text) {
          if (!message || !document.getElementById('netpulse-boot')) return
          message.textContent = text
          if (reload) reload.hidden = false
        }

        var slowTimer = setTimeout(function () {
          showFailure('Still loading. Check your connection, then reload the page.')
        }, 12000)

        window.addEventListener(
          'error',
          function (event) {
            var target = event.target
            if (target && target.tagName === 'SCRIPT') {
              clearTimeout(slowTimer)
              showFailure('The application script could not load. Reload the page to try again.')
              return
            }
            if (!target || target === window) {
              clearTimeout(slowTimer)
              showFailure('The application failed to start. Reload the page to try again.')
            }
          },
          true,
        )

        window.addEventListener('unhandledrejection', function (event) {
          var reason = (event.reason && (event.reason.message || String(event.reason))) || ''
          if (/dynamically imported module|Importing a module script failed|Loading chunk/i.test(reason)) {
            clearTimeout(slowTimer)
            showFailure('Part of the application failed to load. Reload the page to try again.')
          }
        })
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
