name: netpulse-ai

# ---------------------------------------------------------------------------
# Optional MySQL 8 deployment for NetPulse AI.
#
#   Copy .env.docker.example to .env.docker, edit every password, then:
#     docker compose --env-file .env.docker up -d
#
# The backend itself runs on the host (see README.md). It connects to MySQL
# through 127.0.0.1:3307 by default. schema.sql is imported automatically on
# the first start of an empty data volume.
# ---------------------------------------------------------------------------

services:
  mysql:
    image: mysql:8.4
    container_name: netpulse-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.docker}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-netpulse_ai}
      MYSQL_USER: ${MYSQL_USER:-netpulse}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.docker}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - netpulse_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: netpulse-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "${PHPMYADMIN_HOST_PORT:-8081}:80"

volumes:
  netpulse_mysql_data:
    name: netpulse_mysql_data
